<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8E8E8">
  <title>{{ page.title }}{% unless page.title == 'About Me' %} · Grace Somin Lee{% endunless %}</title>
  <link rel="icon" href="{{ '/assets/img/navigation/beings-stone.png' | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Linden+Hill:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>

<body class="page-{{ page.nav_key | default: 'about' }}">
  <header class="stone-menu">
    <nav class="stone-menu__nav" aria-label="Main navigation">
      <a class="stone-link{% if page.nav_key == 'about' or page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}"{% if page.nav_key == 'about' or page.url == '/' %} aria-current="page"{% endif %}>
        <img src="{{ '/assets/img/navigation/about-stone.png' | relative_url }}" alt="">
        <span>About Me</span>
      </a>
      <a class="stone-link{% if page.nav_key == 'projects' %} is-active{% endif %}" href="{{ '/projects/' | relative_url }}"{% if page.nav_key == 'projects' %} aria-current="page"{% endif %}>
        <img src="{{ '/assets/img/navigation/projects-stone.png' | relative_url }}" alt="">
        <span>Projects</span>
      </a>
      <a class="stone-link{% if page.nav_key == 'writings' %} is-active{% endif %}" href="{{ '/writings/' | relative_url }}"{% if page.nav_key == 'writings' %} aria-current="page"{% endif %}>
        <img src="{{ '/assets/img/navigation/writings-stone.png' | relative_url }}" alt="">
        <span>Writings</span>
      </a>
      <a class="stone-link{% if page.nav_key == 'beings' %} is-active{% endif %}" href="{{ '/beings/' | relative_url }}"{% if page.nav_key == 'beings' %} aria-current="page"{% endif %}>
        <img src="{{ '/assets/img/navigation/beings-stone.png' | relative_url }}" alt="">
        <span>Beings</span>
      </a>
    </nav>
  </header>

  <main class="site-content">
    {{ content }}
  </main>
</body>
</html>
